[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-board"
dynamic = ["version"]
description = "Forum-style board over agent-cli — each post is an agent-cli session + workspace"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    # SQLite fallback for Python builds without the stdlib ``sqlite3`` extension
    # (locked-down servers). The ``agent_board._sqlite`` shim prefers stdlib
    # sqlite3 and uses this only when absent. Wheel exists for x86_64 Linux;
    # other platforms ship sqlite3 in their stdlib (macOS/conda/system Python).
    "pysqlite3-binary>=0.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff", "playwright>=1.40"]

[project.scripts]
agent-board = "agent_board.app:main"

[tool.ruff.lint]
# Mirrors agent-cli's policy (sibling repo) so lint is consistent across the
# harness. The default select (E/F + ruff's current stable set) applies; the
# ignores below are DELIBERATE patterns in this codebase, not un-fixed debt:
ignore = [
    # broad ``except Exception:`` — intentional defensive boundaries (proxy
    # relay, health probe, scanner loop, clone) that must degrade, not crash.
    "BLE001",
    # try/except/pass|continue — skip a malformed/stale entry and keep going
    # (corrupt sidecar, dead pid, sid collision).
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# ⏰ 스케줄은 의도적으로 naive 서버-로컬 datetime 을 쓴다 (cron 의미론이
# 로컬 — docs/schedule-design.md §3). DTZ 는 여기선 설계 위반이 아니라 설계.
"agent_board/cron.py" = ["DTZ"]
"agent_board/scheduler.py" = ["DTZ"]
"agent_board/sched_contract.py" = ["DTZ"]
"agent_board/app.py" = ["DTZ005"]
"tests/test_cron.py" = ["DTZ"]
"tests/test_scheduler.py" = ["DTZ"]

[tool.setuptools.dynamic]
# Single source of truth for the version — agent_board/__init__.py.__version__
# (previously duplicated here as a literal, which drifted; AUDIT hygiene).
version = { attr = "agent_board.__version__" }

[tool.setuptools.packages.find]
include = ["agent_board*"]

[tool.setuptools.package-data]
# 최상위("static/*") + 재귀("static/**/*") 둘 다 — 재귀 글롭만으로는
# 최상위 파일이 fnmatch 가드에서 빠지고, 비재귀만으로는 하위 디렉토리
# (fonts/ 등)를 놓친다 (agent-cli woff2 누락 사고와 동일 클래스).
agent_board = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: real-browser (playwright) tests — opt-in via AGENT_BOARD_BROWSER_TESTS=1",
]

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-board</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- 첫 페인트 전 테마 적용 (FOUC 방지) — agent-cli 와 동일 키 공유 -->
  <script>
    (function () {
      var THEMES = ["amber", "slate", "midnight", "terminal", "light"];
      try {
        var t = localStorage.getItem("agentcli_theme");
        if (THEMES.indexOf(t) === -1) {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "amber";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "amber");
      }
    })();
  </script>
</head>
<body>
  <header>
    <h1>agent-board</h1>
    <span id="version" class="version" title="board · agent-cli version"></span>
    <label class="open-mode" title="Off: rooms open in a new tab">
      <input type="checkbox" id="same-tab"> Open in this page
    </label>
    <a id="admin-link" href="/admin" title="admin — edit agent-cli config and models">⚙</a>
    <span id="theme-wrap">
      <button id="theme-btn" class="btn-icon" type="button" title="Theme" aria-haspopup="true" aria-expanded="false">🎨</button>
      <div id="theme-menu" role="menu" hidden></div>
    </span>
  </header>

  <section id="new">
    <input id="new-topic" type="text" placeholder="Topic — e.g. build a library" maxlength="200">
    <select id="new-model" title="Model — only models with a dialect binding are listed (set it in ⚙ admin)"></select>
    <button id="new-adv" type="button" class="btn-ghost" aria-expanded="false" title="Knobs — thinking, grammar, agent cap, compaction, stall, auto-approve, audit. Empty = agent-cli defaults. After creation, change them from the chips inside the room." hidden>⚙ Advanced</button>
    <button id="new-create" type="button" class="btn-primary">+ New post</button>
    <!-- 노브 폼 (v1.36.0): 컨트롤은 agent-cli 의 표(/api/knobs/spec)에서 그려진다 -->
    <div id="new-knobs" class="knob-form" hidden></div>
  </section>

  <main id="posts"></main>

  <!-- 대화방 복제 모달 — 각 글 카드의 '복제' 버튼이 그 글을 원본으로 열기.
       한 창에서 주제·모델·복사 항목을 전부 설정. 닫기(backdrop/Esc)나
       취소 = 중단. -->
  <dialog id="clone-dlg">
    <div class="clone-dlg-head">
      <div class="clone-dlg-title">📋 Clone room</div>
      <button id="clone-x" type="button" class="btn-icon" title="Close">✕</button>
    </div>
    <div id="clone-src-label" class="clone-src-label"></div>
    <div class="clone-fields">
      <input id="clone-topic" type="text" placeholder="New topic" maxlength="200">
      <select id="clone-model" title="Model — only models with a dialect binding are listed (set it in ⚙ admin)"></select>
      <button id="clone-adv" type="button" class="btn-ghost" aria-expanded="false" title="Knobs — pre-filled with the source room's values" hidden>⚙ Advanced</button>
    </div>
    <div id="clone-knobs" class="knob-form" hidden></div>
    <div id="clone-hint" class="clone-hint">Check the files and folders to copy. Include <code>.agent-cli</code> to carry the conversation over.</div>
    <div id="clone-tree" class="clone-tree"></div>
    <div id="clone-msg" class="clone-msg"></div>
    <div class="clone-dlg-foot">
      <button id="clone-cancel" type="button" class="btn-ghost">Cancel</button>
      <button id="clone-go" type="button" class="btn-primary">Create clone</button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>

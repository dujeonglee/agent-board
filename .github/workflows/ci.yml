# agent-cli(형제 저장소)의 ci.yml 을 그대로 따른다 — 같은 하네스인데 한쪽만
# 검증되던 비대칭의 해소. 이 저장소는 그동안 CI 가 없었고, 로컬 macOS 통과가
# 유일한 증거였다(리눅스 전용 실패·부하 경합은 구조적으로 안 보인다).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # ``requires-python = ">=3.10"`` 을 **선언한 최저 버전까지** 돈다 —
      # 선언만 하고 안 돌리면 그건 검증이 아니라 주장이다. 3.10 로컬 확인:
      # 388 passed / 10 skipped.
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 보드는 agent-cli 를 **실행**하고(인스턴스 spawn), admin 은 그 모듈을
      # lazy import 한다(wire format 목록·capability 탐지). 미설치면 그 쪽
      # 테스트가 `pytest.importorskip` 으로 조용히 빠지는데, 그러면 저장소
      # 경계가 깨져도 초록으로 남는다 — 이 하네스가 한 번 크게 당한 부류라
      # 여기서는 **설치하고 돌린다**. agent-cli main 이 깨지면 여기도 빨갛다:
      # 보드가 실제로 그걸 실행하므로 그 신호는 사실이다.
      - name: Install agent-cli (cross-repo seam)
        run: pip install "agent-cli @ git+https://github.com/dujeonglee/agent-cli@main"

      - name: Run unit tests
        run: pytest tests/ -v

  browser:
    # 실브라우저(playwright) — 기본 스위트는 tests/browser 를 수집조차 안
    # 하므로(conftest collect_ignore) 여기서만 옵트인한다. 제목 중복 생성
    # (v1.30.1) 처럼 IME·포커스가 걸린 버그는 여기서만 잡힌다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        env:
          AGENT_BOARD_BROWSER_TESTS: "1"
        run: pytest tests/browser/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # 로컬과 같은 버전으로 고정 — ruff 는 릴리스마다 기본 룰셋이 늘어서
        # 안 박아 두면 로컬 통과분이 새 룰에 걸려 CI 만 빨개진다.
        run: pip install ruff==0.16.0

      - name: Run ruff check
        run: ruff check agent_board/ tests/

      - name: Run ruff format check
        run: ruff format --check agent_board/ tests/
